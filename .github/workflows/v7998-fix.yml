name: v7.9.9.8 Edit add action event isolation
on:
  push:
    paths:
      - '.github/workflows/v7998-fix.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch v7.9.9.8
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          assert 'const APP_VERSION = "7.9.9.7"' in s
          s=s.replace('7.9.9.7','7.9.9.8')
          old='''document.getElementById("trip-edit-sticky-add-stop")?.addEventListener("click",()=>{const dayId=tripEditActiveDayId();if(dayId)openTripEditAddModal(dayId,"stop");});\ndocument.getElementById("trip-edit-sticky-add-transit")?.addEventListener("click",()=>{const dayId=tripEditActiveDayId();if(dayId)openTripEditAddModal(dayId,"transit");});'''
          new='''document.getElementById("trip-edit-sticky-add-stop")?.addEventListener("click",event=>{event.preventDefault();event.stopImmediatePropagation();const dayId=tripEditActiveDayId();if(dayId)openTripEditAddModal(dayId,"stop");});\ndocument.getElementById("trip-edit-sticky-add-transit")?.addEventListener("click",event=>{event.preventDefault();event.stopImmediatePropagation();const dayId=tripEditActiveDayId();if(dayId)openTripEditAddModal(dayId,"transit");});'''
          assert old in s; s=s.replace(old,new,1)
          old='''  document.querySelectorAll(".day-tab").forEach(tab=>{\n    tab.addEventListener("click",()=>{'''
          new='''  tabsEl.querySelectorAll(":scope > .day-tab").forEach(tab=>{\n    tab.addEventListener("click",()=>{\n      if(tab.dataset.dayIndex==null||!String(tab.dataset.dayId||"").trim())return;'''
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s)
          for name in ['manifest.json','sw.js']:
            q=Path(name); q.write_text(q.read_text().replace('7.9.9.7','7.9.9.8'))
          q=Path('CHANGELOG.md')
          entry='''# v7.9.9.8 · Edit Add Action / Day Tab Event Isolation\n\n* Fixed an Edit Mode regression where tapping `新增地點` or `新增交通` also triggered the generic Day-tab click handler because the two add controls reuse the Day-tab visual class. That handler cleared every active Day and Day-content panel, making the itinerary appear blank until a real Day tab was tapped again.\n* Day switching is now bound only to direct children of `#day-tabs`, and the add controls stop same-target propagation before opening their Edit sheet. This keeps the accepted Day selector visuals unchanged while separating Day navigation from Edit actions.\n* No itinerary data, Local Draft data, Firebase data, Transit, Map, media, ordering, sticky Day behaviour or Save-once semantics are changed.\n\n'''
          q.write_text(entry+q.read_text())
          PY
      - name: Validate
        run: |
          grep -q 'const APP_VERSION = "7.9.9.8"' index.html
          grep -q 'tabsEl.querySelectorAll(":scope > .day-tab")' index.html
          grep -q 'stopImmediatePropagation' index.html
          ! grep -Eq '7\.9\.9\.7' index.html manifest.json sw.js
          grep -q 'travel-shell-v7.9.9.8' sw.js
          python -m json.tool manifest.json >/dev/null
      - name: Commit release
        run: |
          git config user.name 'Travel WebApp Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.json sw.js CHANGELOG.md
          git commit -m 'v7.9.9.8 isolate Edit add actions from Day switching'
          git push
