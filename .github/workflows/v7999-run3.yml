name: Retry audited v7.9.9.9 release
on:
  push:
    paths:
      - '.github/workflows/v7999-run3.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact v7.9.9.8 app baseline
        run: |
          test "$(git hash-object index.html)" = "fa80a6e31c98e2b6feae292ca0ff5a188f128b46"
          test "$(git hash-object assets/js/trip-edit-session-service.js)" = "c0e07b2d3e44ab4a1f31a9ac97481255bc746c7e"
          test "$(git hash-object assets/js/trip-map-service.js)" = "8aea6df04a2b85be24b912a7c380a8570d90c973"
          test "$(git hash-object manifest.json)" = "8278da741a11d3791dda2ad0759082c95a68fc01"
          test "$(git hash-object sw.js)" = "f8a7eb9b013bd03673b4ef93adbbd9fab49a94ab"
          test "$(git hash-object CHANGELOG.md)" = "3c8bf39fbe8c31fc5fb90c1e896317f7d3d11b34"
      - name: Preserve protected Day bar functions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, hashlib, json
          s=Path('index.html').read_text()
          names=['refreshCollapseMetrics','updateCompactHeader','updateCollapsingChrome','scheduleCollapseUpdate']
          out={}
          for name in names:
              m=re.search(rf'function {name}\([^)]*\)\{{.*?\n\}}',s,re.S)
              assert m,name
              out[name]=hashlib.sha256(m.group(0).encode()).hexdigest()
          Path('/tmp/daybar-hashes.json').write_text(json.dumps(out,sort_keys=True))
          PY
      - name: Apply audited code patch
        run: |
          base64 -d .release/v7999-code.patch.b64 | gunzip > /tmp/v7999-code.patch
          git apply --check /tmp/v7999-code.patch
          git apply /tmp/v7999-code.patch
      - name: Update changelog
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          entry='''# v7.9.9.9 · Phase 3E Stop Location Picker\n\n* Added Stop-only Google Maps location search inside Edit Mode using the existing Google Maps JavaScript geocoding layer. No Places SDK or second map SDK is introduced.\n* Stop location changes stay in the Local Draft and participate in the existing single Save Firestore transaction. Transit items remain endpoint-driven by the previous and next Stop and do not expose a Location field.\n* New and edited Stop locations carry normalized name, placeId, coordinates, formatted address and Google Maps URL into the draft preview so the Trip Map and Transit endpoint resolution can use the same pending location before global Save.\n* Existing Stop locations are preserved when an Edit Session starts; clearing a Stop location clears the draft map reference and is persisted only on global Save.\n* Protected Day selector sticky/collapse functions are unchanged. Firebase Rules, Transit providers, map renderer policy, media and Phase 3B Map behaviour are unchanged.\n\n'''
          p.write_text(entry+p.read_text())
          PY
      - name: Validate v7.9.9.9
        run: |
          test "$(git hash-object index.html)" = "b96b98a5c6804c852f8da3a30ffc275651f27e9b"
          grep -q 'const APP_VERSION = "7.9.9.9"' index.html
          grep -q '<strong>v7.9.9.9</strong>' index.html
          grep -q 'searchEditableLocations' assets/js/trip-map-service.js
          grep -q 'patch.location' assets/js/trip-edit-session-service.js
          grep -q 'travel-shell-v7.9.9.9' sw.js
          python -m json.tool manifest.json >/dev/null
          node --check sw.js
          node --check assets/js/trip-map-service.js
          node --check assets/js/trip-edit-session-service.js
          python - <<'PY'
          from pathlib import Path
          import re, hashlib, json
          s=Path('index.html').read_text()
          before=json.loads(Path('/tmp/daybar-hashes.json').read_text())
          after={}
          for name in before:
              m=re.search(rf'function {name}\([^)]*\)\{{.*?\n\}}',s,re.S)
              assert m,name
              after[name]=hashlib.sha256(m.group(0).encode()).hexdigest()
          assert before==after,(before,after)
          assert '7.9.9.8' not in Path('manifest.json').read_text()
          assert '7.9.9.8' not in Path('sw.js').read_text()
          PY
      - name: Commit v7.9.9.9
        run: |
          git config user.name 'Travel WebApp Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/js/trip-edit-session-service.js assets/js/trip-map-service.js manifest.json sw.js CHANGELOG.md
          git commit -m 'v7.9.9.9 Phase 3E Stop Location Picker'
          git push
