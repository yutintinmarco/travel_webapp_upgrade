name: v7.9.9.5 sticky Edit actions migration
on:
  push:
    paths:
      - '.github/workflows/v7995-sticky-add.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch v7.9.9.5
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace('const APP_VERSION = "7.9.9.4";','const APP_VERSION = "7.9.9.5";',1)
          old='''.trip-edit-day-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 12px;padding:0 2px;}\n.trip-edit-day-add{min-height:42px;border:1px solid rgba(60,60,67,.13);border-radius:15px;background:rgba(255,255,255,.56);color:#1478d4;font:inherit;font-size:12px;font-weight:720;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.70);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}\n.trip-edit-day-add:active{background:rgba(10,132,255,.10);}\nhtml.theme-dark .trip-edit-day-add,html:not(.theme-light):not(.theme-dark) .trip-edit-day-add{background:rgba(40,40,48,.72);border-color:rgba(255,255,255,.12);color:#69aef5;}\n'''
          new='''.trip-edit-day-actions{display:none!important;}\n.trip-edit-sticky-add{position:sticky;top:calc(var(--compact-header-h) + env(safe-area-inset-top,0px) + 49px);z-index:1190;width:100vw;box-sizing:border-box;margin:0 0 10px calc(50% - 50vw);padding:4px max(18px,calc((100vw - 480px)/2 + 18px)) 8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;background:transparent;isolation:isolate;}\n.trip-edit-sticky-add[hidden]{display:none!important;}\n.trip-edit-sticky-add::before{content:"";position:absolute;z-index:-1;left:50%;top:0;width:100vw;height:100%;transform:translateX(-50%);background:transparent;border-bottom:.5px solid transparent;pointer-events:none;}\n.trip-edit-sticky-add .day-tab{margin:0;min-width:0!important;width:100%;padding-left:2px!important;padding-right:2px!important;font-size:calc(10.5px * var(--font-scale));color:#1478d4;font-weight:650;}\nhtml.theme-dark .trip-edit-sticky-add .day-tab,html:not(.theme-light):not(.theme-dark) .trip-edit-sticky-add .day-tab{color:#69aef5;}\n'''
          assert old in s
          s=s.replace(old,new,1)
          old='<div class="day-tabs" id="day-tabs"></div>\n  <div id="day-contents"></div>'
          new='<div class="day-tabs" id="day-tabs"></div>\n  <div class="trip-edit-sticky-add" id="trip-edit-sticky-add" hidden>\n    <button class="day-tab" id="trip-edit-sticky-add-stop" type="button"><span aria-hidden="true">＋</span> 新增地點</button>\n    <button class="day-tab" id="trip-edit-sticky-add-transit" type="button"><span aria-hidden="true">＋</span> 新增交通</button>\n  </div>\n  <div id="day-contents"></div>'
          assert old in s
          s=s.replace(old,new,1)
          old='''function tripEditSyncHeader(){\n  const edit=document.getElementById("trip-edit-btn"),actions=document.getElementById("trip-edit-session-actions"),save=document.getElementById("trip-edit-save-btn");\n  if(edit)edit.hidden=true;\n  if(actions)actions.hidden=!tripEditIsActive();\n'''
          new='''function tripEditSyncHeader(){\n  const edit=document.getElementById("trip-edit-btn"),actions=document.getElementById("trip-edit-session-actions"),save=document.getElementById("trip-edit-save-btn"),stickyAdd=document.getElementById("trip-edit-sticky-add");\n  if(edit)edit.hidden=true;\n  if(actions)actions.hidden=!tripEditIsActive();\n  if(stickyAdd)stickyAdd.hidden=!tripEditIsActive();\n'''
          assert old in s
          s=s.replace(old,new,1)
          old='''  document.querySelectorAll(".day-content[data-day-id]").forEach(content=>{\n    let actions=content.querySelector(":scope > .trip-edit-day-actions");\n    if(!tripEditSession){if(actions)actions.remove();return;}\n    if(!actions){\n      actions=document.createElement("div");actions.className="trip-edit-day-actions";\n      const stop=document.createElement("button");stop.type="button";stop.className="trip-edit-day-add";stop.innerHTML='<span aria-hidden="true">＋</span><span>新增地點</span>';\n      const transit=document.createElement("button");transit.type="button";transit.className="trip-edit-day-add";transit.innerHTML='<span aria-hidden="true">＋</span><span>新增交通</span>';\n      stop.addEventListener("click",()=>openTripEditAddModal(content.dataset.dayId,"stop"));\n      transit.addEventListener("click",()=>openTripEditAddModal(content.dataset.dayId,"transit"));\n      actions.append(stop,transit);\n      const firstItem=content.querySelector(":scope > .itinerary-item");\n      if(firstItem)content.insertBefore(actions,firstItem);else content.appendChild(actions);\n    }\n  });\n'''
          assert old in s
          s=s.replace(old,'  document.querySelectorAll(".trip-edit-day-actions").forEach(actions=>actions.remove());\n',1)
          anchor='async function beginTripEditSession(){\n'
          insert='''function tripEditActiveDayId(){\n  return String(document.querySelector(".day-tab.active[data-day-id]")?.dataset?.dayId||"").trim();\n}\ndocument.getElementById("trip-edit-sticky-add-stop")?.addEventListener("click",()=>{const dayId=tripEditActiveDayId();if(dayId)openTripEditAddModal(dayId,"stop");});\ndocument.getElementById("trip-edit-sticky-add-transit")?.addEventListener("click",()=>{const dayId=tripEditActiveDayId();if(dayId)openTripEditAddModal(dayId,"transit");});\n\n'''+anchor
          assert anchor in s
          s=s.replace(anchor,insert,1)
          p.write_text(s)
          for name in ['manifest.json','sw.js']:
            q=Path(name); q.write_text(q.read_text().replace('7.9.9.4','7.9.9.5'))
          q=Path('CHANGELOG.md'); q.write_text('# v7.9.9.5 · Sticky Edit Add Actions\n\n* In Edit Mode, `新增地點` and `新增交通` now use the same capsule visual grammar as the Day selector and remain sticky directly below the protected Day bar while the itinerary scrolls.\n* The action row always targets the currently active Day.\n* The accepted Day bar itself is unchanged; no Transit, Map, Firebase schema, ordering or Save-once semantics were modified.\n\n'+q.read_text())
          PY
      - name: Validate
        run: |
          grep -q 'const APP_VERSION = "7.9.9.5"' index.html
          grep -q 'trip-edit-sticky-add-stop' index.html
          grep -q 'travel-shell-v7.9.9.5' sw.js
          python -m json.tool manifest.json >/dev/null
      - name: Commit release
        run: |
          git config user.name 'Travel WebApp Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.json sw.js CHANGELOG.md
          git commit -m 'v7.9.9.5 sticky Edit add actions'
          git push
