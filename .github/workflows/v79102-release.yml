name: v7.9.10.2 Short Link Resolver release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79102-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preserve accepted baseline for freeze checks
        run: git show HEAD:index.html > /tmp/v79101-index.html

      - name: Rebuild and apply exact verified release patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,zlib,hashlib,subprocess
          expected={
            'functions/index.js':'8d3f716105cb52952f513d736b7551b6a5746e1d',
            'index.html':'e295db214009aa8490ffbfd3489b0597d2481971',
            'assets/js/trip-map-service.js':'60b3585147d8b8edb39afd07af96b9459b7ccd09',
            'manifest.json':'a8da19e43a8029972e8271cef667ac3021cf5910',
            'sw.js':'8ec70ed6e67d05365f6db210278201b23f86d992',
            'CHANGELOG.md':'0794dc1523f6bdf93e69e47926361ffc0db3ad9a'
          }
          for path,sha in expected.items():
            got=subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip()
            if got!=sha: raise SystemExit(f'Baseline guard failed for {path}: {got} != {sha}')
          encoded=''.join(Path(f'.release/v79102.part{i}').read_text() for i in range(1,6))
          patch=zlib.decompress(base64.b64decode(encoded))
          digest=hashlib.sha256(patch).hexdigest()
          if digest!='411568f95192baa74b9d2e0a8591d7f13b786e6ff7272be1b1f60367dcd1f54e':
            raise SystemExit(f'Patch digest mismatch: {digest}')
          Path('/tmp/v79102.patch').write_bytes(patch)
          subprocess.check_call(['git','apply','--check','/tmp/v79102.patch'])
          subprocess.check_call(['git','apply','/tmp/v79102.patch'])
          print('Verified patch applied')
          PY

      - name: Static QA and protected Day bar check
        run: |
          node --check functions/index.js
          node --check sw.js
          node --input-type=module --check < assets/js/trip-map-service.js
          python - <<'PY'
          from pathlib import Path
          import json,re,hashlib
          s=Path('index.html').read_text()
          base=Path('/tmp/v79101-index.html').read_text()
          json.loads(Path('manifest.json').read_text())
          assert '7.9.10.2' in s and '7.9.10.1' not in s
          assert 'trip-edit-item-action-dock' in s
          assert 'maps.app.goo.gl' in s
          assert 'resolveGoogleMapsShortLink' in Path('functions/index.js').read_text()
          for fn in ['refreshCollapseMetrics','updateCompactHeader','updateCollapsingChrome','scheduleCollapseUpdate']:
              pat=re.compile(rf'function {fn}\([^)]*\)\{{.*?\n\}}',re.S)
              a,b=pat.search(base),pat.search(s)
              assert a and b
              assert hashlib.sha256(a.group(0).encode()).hexdigest()==hashlib.sha256(b.group(0).encode()).hexdigest(),fn
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,b in enumerate(blocks):
              if b.strip(): Path(f'/tmp/inline_{i}.js').write_text(b)
          print('QA OK')
          PY
          for f in /tmp/inline_*.js; do node --check "$f"; done

      - name: Try deploy short-link resolver Function
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRAVEL_APP_744AB }}
        run: |
          set +e
          DEPLOYED=0
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-service-account.json
            GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json npx --yes firebase-tools@14.12.1 deploy --only functions:resolveGoogleMapsShortLink --project travel-app-744ab --non-interactive
            [ $? -eq 0 ] && DEPLOYED=1
          fi
          if [ "$DEPLOYED" -eq 0 ] && [ -n "$FIREBASE_TOKEN" ]; then
            npx --yes firebase-tools@14.12.1 deploy --only functions:resolveGoogleMapsShortLink --project travel-app-744ab --non-interactive --token "$FIREBASE_TOKEN"
            [ $? -eq 0 ] && DEPLOYED=1
          fi
          if [ "$DEPLOYED" -eq 0 ]; then
            echo '::warning::Firebase short-link resolver source is ready but deployment credential is not configured. Frontend will keep its graceful unavailable fallback until the Function is deployed.'
          else
            echo 'Firebase short-link resolver deployed successfully.'
          fi
          exit 0

      - name: Build clean backup ZIP
        run: |
          zip -qr /tmp/travel-webapp-phase3e-v7.9.10.2.zip . -x '.git/*' '.release/*' '.github/*'

      - uses: actions/upload-artifact@v4
        with:
          name: travel-webapp-phase3e-v7.9.10.2
          path: /tmp/travel-webapp-phase3e-v7.9.10.2.zip
          retention-days: 7

      - name: Commit verified release
        run: |
          git config user.name 'yutintinmarco'
          git config user.email 'marcoyu1121@gmail.com'
          git add functions/index.js index.html assets/js/trip-map-service.js manifest.json sw.js CHANGELOG.md
          git commit -m 'v7.9.10.2 Google Maps short-link resolver and edit action dock'
          git push
