name: v7.9.9.4 Edit Mode migration
on:
  push:
    paths:
      - '.github/workflows/v7994-add-items.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v7.9.9.4 migration
        run: |
          python tools/v7994_migrate.py
          node --check assets/js/trip-edit-session-service.js
          rm -f tools/v7994_migrate.py .github/workflows/v7994-add-items.yml
          git config user.name "Travel WebApp Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v7.9.9.4 Phase 3E add Stop and Transit drafts"
          git push