name: v7.9.9.3 regression recovery

on:
  push:
    paths:
      - '.github/workflows/v7993-fix.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build v7.9.9.3 from current v7.9.9.2
        run: python tools/v7993_fix.py
      - name: Syntax and package QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=[m.group(1) for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)]
          Path('/tmp/app-runtime.js').write_text(scripts[-1],encoding='utf-8')
          print('index bytes',Path('index.html').stat().st_size)
          PY
          node --check /tmp/app-runtime.js
          test ! -d assets/shell
          ! grep -q 'assets/shell/' index.html
          grep -q 'const APP_VERSION = "7.9.9.3"' index.html
          grep -q 'travel-shell-v7.9.9.3' sw.js
      - name: Commit release and remove one-off migration files
        run: |
          rm -f tools/v7993_fix.py .github/workflows/v7993-fix.yml
          git config user.name 'Travel WebApp Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v7.9.9.3 regression recovery and edit navigation'
          git push
