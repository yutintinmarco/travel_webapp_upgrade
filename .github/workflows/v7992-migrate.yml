name: v7.9.9.2 shell migration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v7992-migrate.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build v7.9.9.2
        run: python tools/v7992_migrate.py
      - name: Syntax check shell carriers
        run: |
          node --check assets/shell/app-runtime-init.js
          node --check assets/shell/app-runtime-exec.js
          for f in assets/shell/app-runtime-part-*.js; do node --check "$f"; done
      - name: Commit release
        run: |
          git config user.name "Travel WebApp Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v7.9.9.2 low-risk shell extraction and edit UI refinement"
          git push origin HEAD:main
