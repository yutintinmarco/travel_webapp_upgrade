name: v7.9.9.7 Edit chrome regression cleanup
on:
  push:
    paths:
      - '.github/workflows/v7997-fix.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch v7.9.9.7
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, hashlib
          p=Path('index.html'); s=p.read_text()
          protected=['refreshCollapseMetrics','updateCompactHeader','updateCollapsingChrome','scheduleCollapseUpdate']
          def fn(name,text):
              m=re.search(rf'function {name}\([^)]*\)\{{.*?\n\}}',text,re.S)
              assert m, name
              return m.group(0)
          before={name:hashlib.sha256(fn(name,s).encode()).hexdigest() for name in protected}
          s=s.replace('7.9.9.6','7.9.9.7')
          old='.header-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }'
          new='.header-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }\n.header-top > div:first-child { flex: 1 1 auto; min-width: 0; }'
          assert old in s; s=s.replace(old,new,1)
          old='.header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }\n.today-chip { font-size: calc(11px * var(--font-scale)); padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid rgba(255,255,255,0.72); color: #333; max-width: 150px; text-align: right; line-height: 1.4; box-shadow: 0 2px 6px rgba(15,23,42,0.08); }'
          new='.header-right { display: flex; flex: 0 0 auto; flex-direction: column; align-items: flex-end; gap: 6px; }\n.today-chip { font-size: calc(11px * var(--font-scale)); padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid rgba(255,255,255,0.72); color: #333; max-width: 150px; text-align: right; line-height: 1.4; white-space: nowrap; box-shadow: 0 2px 6px rgba(15,23,42,0.08); }'
          assert old in s; s=s.replace(old,new,1)
          old='.trip-edit-sticky-add::before{content:"";position:absolute;z-index:-1;left:50%;top:0;width:100vw;height:100%;transform:translateX(-50%);background:var(--sticky-material);border-bottom:.5px solid var(--separator);backdrop-filter:blur(24px) saturate(155%);-webkit-backdrop-filter:blur(24px) saturate(155%);pointer-events:none;}'
          new='.trip-edit-sticky-add::before{content:"";position:absolute;z-index:-1;left:50%;top:0;width:100vw;height:100%;transform:translateX(-50%);background:transparent;border-bottom:.5px solid transparent;backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0);transition:background .20s ease,border-color .20s ease,backdrop-filter .20s ease;pointer-events:none;}\n.trip-edit-sticky-add.is-stuck::before{background:var(--sticky-material);border-bottom-color:var(--separator);backdrop-filter:blur(24px) saturate(155%);-webkit-backdrop-filter:blur(24px) saturate(155%);}'
          assert old in s; s=s.replace(old,new,1)
          anchor='function tripEditSyncHeader(){\n'
          helper='''let tripEditStickyRaf=0,tripEditStickyTop=107;\nfunction tripEditRefreshStickyTop(){\n  const el=document.getElementById("trip-edit-sticky-add");if(!el)return;\n  const top=parseFloat(getComputedStyle(el).top);tripEditStickyTop=Number.isFinite(top)?top:107;\n}\nfunction updateTripEditStickyChrome(){\n  tripEditStickyRaf=0;\n  const el=document.getElementById("trip-edit-sticky-add"),shell=document.getElementById("scroll-shell");\n  if(!el||el.hidden||currentAppView!=="itinerary"){el?.classList.remove("is-stuck");return;}\n  const y=Math.max(0,shell?.scrollTop||0),isStuck=el.getBoundingClientRect().top<=tripEditStickyTop+4&&y>4;\n  el.classList.toggle("is-stuck",isStuck);\n}\nfunction scheduleTripEditStickyChrome(){\n  if(tripEditStickyRaf)return;tripEditStickyRaf=requestAnimationFrame(updateTripEditStickyChrome);\n}\n'''+anchor
          assert anchor in s; s=s.replace(anchor,helper,1)
          old='  if(stickyAdd)stickyAdd.hidden=!tripEditIsActive();\n  if(save){save.disabled=tripEditSaving;save.textContent=tripEditSaving?"儲存中…":"儲存";}'
          new='  if(stickyAdd){stickyAdd.hidden=!tripEditIsActive();if(stickyAdd.hidden)stickyAdd.classList.remove("is-stuck");else tripEditRefreshStickyTop();}\n  if(save){save.disabled=tripEditSaving;save.textContent=tripEditSaving?"儲存中…":"儲存";}'
          assert old in s; s=s.replace(old,new,1)
          old='  tripEditSyncProfileEntry();\n}\nfunction tripEditFindDomItem'
          new='  tripEditSyncProfileEntry();\n  scheduleTripEditStickyChrome();\n}\nfunction tripEditFindDomItem'
          assert old in s; s=s.replace(old,new,1)
          old='scrollShell?.addEventListener("scroll",scheduleCollapseUpdate,{passive:true});\nwindow.addEventListener("resize",()=>{refreshCollapseMetrics();updateBottomNavIndicator();scheduleCollapseUpdate();},{passive:true});'
          new='scrollShell?.addEventListener("scroll",scheduleCollapseUpdate,{passive:true});\nscrollShell?.addEventListener("scroll",scheduleTripEditStickyChrome,{passive:true});\nwindow.addEventListener("resize",()=>{refreshCollapseMetrics();updateBottomNavIndicator();scheduleCollapseUpdate();},{passive:true});\nwindow.addEventListener("resize",()=>{tripEditRefreshStickyTop();scheduleTripEditStickyChrome();},{passive:true});'
          assert old in s; s=s.replace(old,new,1)
          after={name:hashlib.sha256(fn(name,s).encode()).hexdigest() for name in protected}
          assert before==after, (before,after)
          p.write_text(s)
          for name in ['manifest.json','sw.js']:
              q=Path(name); q.write_text(q.read_text().replace('7.9.9.6','7.9.9.7'))
          q=Path('CHANGELOG.md')
          entry='''# v7.9.9.7 · Edit Chrome Regression Cleanup\n\n* Kept the trip lifecycle status chip, including `行程已完成`, on one line by reserving its natural width and letting the trip title wrap in the remaining header space.\n* Matched the protected Day selector behaviour for the Edit Mode add rail: the full-width material backing is transparent in normal document flow and appears only after the add row itself actually becomes sticky.\n* The Edit add rail owns an independent scroll-state helper. The accepted Day selector CSS and its protected `refreshCollapseMetrics`, `updateCompactHeader`, `updateCollapsingChrome`, and `scheduleCollapseUpdate` functions are unchanged.\n* Focused regression review confirmed no other file-level changes since v7.9.9.4 outside index / manifest / service worker / changelog; Transit, Map, Firebase schema, draft ordering, Save-once semantics, background handling, native time picker and bottom navigation remain unchanged.\n\n'''
          q.write_text(entry+q.read_text())
          PY
      - name: Validate
        run: |
          grep -q 'const APP_VERSION = "7.9.9.7"' index.html
          grep -q '<strong>v7.9.9.7</strong>' index.html
          grep -q 'white-space: nowrap' index.html
          grep -q 'trip-edit-sticky-add.is-stuck::before' index.html
          grep -q 'scheduleTripEditStickyChrome' index.html
          ! grep -Eq '7\.9\.9\.(4|5|6)' index.html manifest.json sw.js
          grep -q 'travel-shell-v7.9.9.7' sw.js
          python -m json.tool manifest.json >/dev/null
      - name: Commit release
        run: |
          git config user.name 'Travel WebApp Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.json sw.js CHANGELOG.md
          git commit -m 'v7.9.9.7 Edit chrome regression cleanup'
          git push
