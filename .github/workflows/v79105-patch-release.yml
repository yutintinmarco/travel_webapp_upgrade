name: v7.9.10.5 exact patch release

on:
  push:
    paths:
      - '.github/workflows/v79105-patch-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact audited patch
        run: |
          cp index.html /tmp/base-index.html
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,subprocess,zlib
          expected={'index.html':'a21831e41a0df76674d2bcb681877270656a5deb','manifest.json':'9f00fea970a5555e80e7ae67065b4e55d73ac378','sw.js':'ccab07113ca71196521c0e639e5a67978d77dd34','CHANGELOG.md':'b571058f3c14576161f03ce765da5a883134a01a','assets/js/trip-loader-service.js':'b8a0ebb54d951ff688d64b4c3ab82ec2c2f06635','functions/index.js':'f154eee2b1c8340737c8558ce38a478a10d87d44'}
          for path,sha in expected.items():
              got=subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip()
              if got!=sha: raise SystemExit(f'Baseline mismatch {path}: {got} != {sha}')
          encoded=''
          patch=zlib.decompress(base64.b64decode(encoded))
          if hashlib.sha256(patch).hexdigest()!='355b8c1dcf3eddc1287bc924fb6736a811f1db7ca210c2d1b72e45553327dff0': raise SystemExit('Patch digest mismatch')
          Path('/tmp/v79105.patch').write_bytes(patch)
          subprocess.check_call(['git','apply','-p1','--check','/tmp/v79105.patch'])
          subprocess.check_call(['git','apply','-p1','/tmp/v79105.patch'])
          out={'index.html':'eacdc62789c33a237a8ddb26339cfdeb772e74fd16877600e5c404633643a03c','manifest.json':'949aa0fd5e11a60feae96906679ff3dbcaa2f9760b05dfc6cf2a51d4a8b9f048','sw.js':'1df7b7f1d440f26672e8d2e9329410b1305af26280699f56ab19056d81703757','CHANGELOG.md':'8e05c87014e98f8be090cf5e7e2b897dab4b2abc69646078488cea6dbe1006b7','assets/js/trip-loader-service.js':'c9d27634eadcf7f6b4f9a0940f79354651fd140531ebb3ebfe6243d3a53ab8e7'}
          for path,want in out.items():
              got=hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if got!=want: raise SystemExit(f'Output mismatch {path}: {got} != {want}')
          print('Exact v7.9.10.5 outputs OK')
          PY
          node --check sw.js
          node --check functions/index.js
          node --input-type=module --check < assets/js/trip-loader-service.js
          python -m json.tool manifest.json >/dev/null
          git diff --check
      - name: Protected surface guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          s=Path('index.html').read_text();b=Path('/tmp/base-index.html').read_text()
          def same(a,z):
              a0=b.index(a);a1=b.index(z,a0);b0=s.index(a);b1=s.index(z,b0)
              if hashlib.sha256(b[a0:a1].encode()).digest()!=hashlib.sha256(s[b0:b1].encode()).digest(): raise SystemExit(a)
          same('async function renderTripMapScope(scope=tripMapScope){','async function openTripMap(){')
          same('async function ensureTransitRoutePlanner(itemEl){','// Phase 3E · Edit Session foundation')
          same('async function tripEditHandleMapPick(coords={}){','async function deleteTripEditItemFromSession(){')
          for fn in ['refreshCollapseMetrics','updateCompactHeader','updateCollapsingChrome','scheduleCollapseUpdate']:
              pat=re.compile(rf'function {fn}\([^)]*\)\{{.*?\n\}}',re.S);x,y=pat.search(b),pat.search(s)
              if not x or not y or hashlib.sha256(x.group(0).encode()).digest()!=hashlib.sha256(y.group(0).encode()).digest(): raise SystemExit(fn)
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,v in enumerate(blocks):
              if v.strip(): Path(f'/tmp/i{i}.js').write_text(v)
          print('Protected surfaces OK')
          PY
          for f in /tmp/i*.js; do node --check "$f"; done
      - name: Build backup
        run: |
          zip -qr /tmp/Travel_WebApp_v7.9.10.5_backup.zip . -x '.git/*' '.github/workflows/v79105-release.yml' '.github/workflows/v79105-final.yml' '.github/workflows/v79105-patch-release.yml'
          unzip -t /tmp/Travel_WebApp_v7.9.10.5_backup.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: Travel_WebApp_v7.9.10.5_backup
          path: /tmp/Travel_WebApp_v7.9.10.5_backup.zip
          retention-days: 7
      - name: Commit release
        run: |
          git config user.name 'yutintinmarco'
          git config user.email 'marcoyu1121@gmail.com'
          git add index.html manifest.json sw.js CHANGELOG.md assets/js/trip-loader-service.js
          git rm .github/workflows/v79105-release.yml .github/workflows/v79105-final.yml .github/workflows/v79105-patch-release.yml
          git commit -m 'v7.9.10.5 Phase 3E post-save item reconciliation'
          git push origin main
