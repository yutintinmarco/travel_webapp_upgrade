name: v7.9.10.5 literal-anchor release

on:
  push:
    paths:
      - '.github/workflows/v79105-patch-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply audited source changes
        run: |
          cp index.html /tmp/base-index.html
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess

          expected = {
            'index.html': 'a21831e41a0df76674d2bcb681877270656a5deb',
            'manifest.json': '9f00fea970a5555e80e7ae67065b4e55d73ac378',
            'sw.js': 'ccab07113ca71196521c0e639e5a67978d77dd34',
            'CHANGELOG.md': 'b571058f3c14576161f03ce765da5a883134a01a',
            'assets/js/trip-loader-service.js': 'b8a0ebb54d951ff688d64b4c3ab82ec2c2f06635',
            'functions/index.js': 'f154eee2b1c8340737c8558ce38a478a10d87d44'
          }
          for path, sha in expected.items():
              got = subprocess.check_output(['git', 'rev-parse', f'HEAD:{path}'], text=True).strip()
              if got != sha:
                  raise SystemExit(f'Baseline mismatch {path}: {got} != {sha}')

          loader = Path('assets/js/trip-loader-service.js')
          s = loader.read_text()

          old = '''  let hydratedRevision = seedRevision;\n  const seedDays = Array.isArray(seedData?.days) ? seedData.days : [];\n'''
          new = '''  let hydratedRevision = seedRevision;\n  // v7.9.10.5 · Server-confirmation evidence for Day item listeners is\n  // revision-scoped. When the Trip root advances first, old itemServerReady\n  // flags must not certify a transient composite of the new revision with\n  // previous-revision item data.\n  let hydrationTargetRevision = 0;\n  const seedDays = Array.isArray(seedData?.days) ? seedData.days : [];\n'''
          if s.count(old) != 1:
              raise SystemExit('loader anchor 1 mismatch')
          s = s.replace(old, new, 1)

          old = '''    if (sourceMeta.get("trip")?.fromCache === false) {\n      hydratedRevision = Math.max(1, numberOr(state.tripDoc?.revision, hydratedRevision || 1));\n    }\n    return true;\n'''
          new = '''    if (sourceMeta.get("trip")?.fromCache === false) {\n      hydratedRevision = Math.max(1, numberOr(state.tripDoc?.revision, hydratedRevision || 1));\n      hydrationTargetRevision = 0;\n    }\n    return true;\n'''
          if s.count(old) != 1:
              raise SystemExit('loader anchor 2 mismatch')
          s = s.replace(old, new, 1)

          old = '''      const serverRevision = Math.max(1, numberOr(next.revision, 1));\n      if (hydratedRevision && serverRevision !== hydratedRevision) {\n        fullHydrationNeeded = true;\n        reconcileItemListeners();\n      }\n'''
          new = '''      const serverRevision = Math.max(1, numberOr(next.revision, 1));\n      if (hydratedRevision && serverRevision !== hydratedRevision) {\n        // A root revision can arrive before every Day/items listener reflects\n        // the same transaction. Invalidate old-revision hydration evidence once\n        // per target revision so assemblePortableTrip cannot label that mixed\n        // snapshot serverConfirmed and briefly resurrect a deleted item.\n        if (hydrationTargetRevision !== serverRevision) {\n          hydrationTargetRevision = serverRevision;\n          itemServerReady.clear();\n        }\n        fullHydrationNeeded = true;\n        reconcileItemListeners();\n      }\n'''
          if s.count(old) != 1:
              raise SystemExit('loader anchor 3 mismatch')
          s = s.replace(old, new, 1)
          loader.write_text(s)

          for rel in ['index.html', 'manifest.json', 'sw.js']:
              p = Path(rel)
              t = p.read_text()
              if '7.9.10.4' not in t:
                  raise SystemExit(f'{rel} version anchor missing')
              p.write_text(t.replace('7.9.10.4', '7.9.10.5'))

          changelog = Path('CHANGELOG.md')
          t = changelog.read_text()
          if not t.startswith('# v7.9.10.4'):
              raise SystemExit('Unexpected changelog head')
          entry = '''# v7.9.10.5 · Phase 3E Post-Save Item Reconciliation\n\n* Fixed the brief deleted-item flash seen on real device after a successful Edit Mode Save. The Trip root revision and per-Day item listeners can settle independently; a new root revision could therefore be combined momentarily with previous-revision item data.\n* Day item server-confirmation evidence is now explicitly revision-scoped. When the Trip root advances, prior `itemServerReady` evidence is invalidated once for that target revision and every required Day must re-confirm before the assembled Trip can be marked fully server-confirmed.\n* This works with the v7.9.10.4 Local First regression guard: transient same-revision composites are ignored until their itinerary presentation matches the already accepted Edit result, preventing a deleted Stop/Transit from flashing back into the itinerary or Trip Map.\n* Day Bar, Trip Overview Map renderer, Transit Gallery/providers, Location Picker, Edit Save-once transaction, Firebase schema and Firebase Functions are unchanged.\n\n'''
          changelog.write_text(entry + t)

          outputs = {
            'index.html': 'eacdc62789c33a237a8ddb26339cfdeb772e74fd16877600e5c404633643a03c',
            'manifest.json': '949aa0fd5e11a60feae96906679ff3dbcaa2f9760b05dfc6cf2a51d4a8b9f048',
            'sw.js': '1df7b7f1d440f26672e8d2e9329410b1305af26280699f56ab19056d81703757',
            'CHANGELOG.md': '8e05c87014e98f8be090cf5e7e2b897dab4b2abc69646078488cea6dbe1006b7',
            'assets/js/trip-loader-service.js': 'c9d27634eadcf7f6b4f9a0940f79354651fd140531ebb3ebfe6243d3a53ab8e7'
          }
          for path, wanted in outputs.items():
              got = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if got != wanted:
                  raise SystemExit(f'Output mismatch {path}: {got} != {wanted}')
          print('Exact v7.9.10.5 source hashes OK')
          PY

      - name: Focused QA
        run: |
          node --check sw.js
          node --check functions/index.js
          node --input-type=module --check < assets/js/trip-loader-service.js
          python -m json.tool manifest.json >/dev/null
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          s = Path('index.html').read_text()
          base = Path('/tmp/base-index.html').read_text()
          assert 'const APP_VERSION = "7.9.10.5";' in s
          assert 'travel-shell-v7.9.10.5' in Path('sw.js').read_text()

          def unchanged(start, end):
              a0 = base.index(start); a1 = base.index(end, a0)
              b0 = s.index(start); b1 = s.index(end, b0)
              if hashlib.sha256(base[a0:a1].encode()).digest() != hashlib.sha256(s[b0:b1].encode()).digest():
                  raise SystemExit(f'Protected block changed: {start}')

          unchanged('async function renderTripMapScope(scope=tripMapScope){', 'async function openTripMap(){')
          unchanged('async function ensureTransitRoutePlanner(itemEl){', '// Phase 3E · Edit Session foundation')
          unchanged('async function tripEditHandleMapPick(coords={}){', 'async function deleteTripEditItemFromSession(){')
          for fn in ['refreshCollapseMetrics', 'updateCompactHeader', 'updateCollapsingChrome', 'scheduleCollapseUpdate']:
              pat = re.compile(rf'function {fn}\([^)]*\)\{{.*?\n\}}', re.S)
              a, b = pat.search(base), pat.search(s)
              if not a or not b or hashlib.sha256(a.group(0).encode()).digest() != hashlib.sha256(b.group(0).encode()).digest():
                  raise SystemExit(f'Protected function changed: {fn}')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S | re.I)
          for i, block in enumerate(blocks):
              if block.strip():
                  Path(f'/tmp/inline_{i}.js').write_text(block)
          print('Focused protected-surface QA OK')
          PY
          for f in /tmp/inline_*.js; do node --check "$f"; done

      - name: Build backup
        run: |
          zip -qr /tmp/Travel_WebApp_v7.9.10.5_backup.zip . \
            -x '.git/*' \
               '.github/workflows/v79105-release.yml' \
               '.github/workflows/v79105-final.yml' \
               '.github/workflows/v79105-patch-release.yml'
          unzip -t /tmp/Travel_WebApp_v7.9.10.5_backup.zip >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: Travel_WebApp_v7.9.10.5_backup
          path: /tmp/Travel_WebApp_v7.9.10.5_backup.zip
          retention-days: 7

      - name: Commit release and clean staging
        run: |
          git config user.name 'yutintinmarco'
          git config user.email 'marcoyu1121@gmail.com'
          git add index.html manifest.json sw.js CHANGELOG.md assets/js/trip-loader-service.js
          git rm .github/workflows/v79105-release.yml .github/workflows/v79105-final.yml .github/workflows/v79105-patch-release.yml
          git commit -m 'v7.9.10.5 Phase 3E post-save item reconciliation'
          git push origin main
