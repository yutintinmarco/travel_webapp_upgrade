name: v7.9.10.0 Places Interactive Location Picker release
on:
  push:
    paths:
      - '.github/workflows/v799100-release.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact v7.9.9.9 app baseline
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "b96b98a5c6804c852f8da3a30ffc275651f27e9b"
          test "$(git hash-object assets/js/trip-map-service.js)" = "d1ac340cc04c191bebd25402cd77df8f1e34aba7"
          test "$(git hash-object manifest.json)" = "54627c443e7fed1cb718bfeba296a6da95b8db5b"
          test "$(git hash-object sw.js)" = "bd10571ffe51ab918432926ffcc80dafcb36283e"
          grep -q '^# v7.9.9.9 · Phase 3E Stop Location Picker' CHANGELOG.md
      - name: Preserve protected Day bar functions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, hashlib, json
          s=Path('index.html').read_text()
          names=['refreshCollapseMetrics','updateCompactHeader','updateCollapsingChrome','scheduleCollapseUpdate']
          out={}
          for name in names:
              m=re.search(rf'function {name}\([^)]*\)\{{.*?\n\}}',s,re.S)
              assert m,name
              out[name]=hashlib.sha256(m.group(0).encode()).hexdigest()
          Path('/tmp/daybar-hashes.json').write_text(json.dumps(out,sort_keys=True))
          PY
      - name: Apply audited v7.9.10.0 patch
        shell: bash
        run: |
          base64 -d .release/v799100.patch.b64 | gunzip > /tmp/v799100.patch
          git apply --check /tmp/v799100.patch
          git apply /tmp/v799100.patch
      - name: Prepend v7.9.10.0 changelog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          old=p.read_text()
          entry='''# v7.9.10.0 · Phase 3E Places Powered Interactive Location Picker\n\n* Upgraded Stop location search from Geocoder-first matching to Google Places Autocomplete Data results, with Geocoder retained as a graceful fallback when Places is unavailable.\n* Search results now show multiple candidate place names plus secondary location text so same-name businesses, branches, stations and POIs can be distinguished before selection.\n* Selecting a Places result fetches only the required Place fields for the Edit preview: display name, formatted address, location and Google Maps URI.\n* Added an inline Google Map preview for the selected Stop location. The preview uses the existing Google Maps JavaScript renderer and does not introduce a second map SDK.\n* The preview map supports direct map tapping to fine-tune the exact coordinate. A tapped coordinate is reverse-geocoded for confirmation and is kept only in the current Local Draft until the global Edit Mode Save.\n* Places predictions include adjacent Google Maps attribution. Transit items remain endpoint-driven and do not expose a Location field.\n* Protected Day selector sticky/collapse functions, Transit providers, Trip Overview Map behaviour, Firebase Rules, media and Save-once transaction architecture are unchanged.\n\n'''
          assert old.startswith('# v7.9.9.9 · Phase 3E Stop Location Picker')
          p.write_text(entry+old)
          PY
      - name: Validate v7.9.10.0
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, hashlib, json
          s=Path('index.html').read_text()
          assert 'const APP_VERSION = "7.9.10.0";' in s
          assert 'trip-edit-location-preview' in s
          assert 'Google Places' in s
          assert 'createEditableLocationPreview' in Path('assets/js/trip-map-service.js').read_text()
          manifest=json.loads(Path('manifest.json').read_text())
          assert 'build=7.9.10.0' in manifest['start_url']
          sw=Path('sw.js').read_text()
          assert 'travel-shell-v7.9.10.0' in sw
          before=json.loads(Path('/tmp/daybar-hashes.json').read_text())
          for name,wanted in before.items():
              m=re.search(rf'function {name}\([^)]*\)\{{.*?\n\}}',s,re.S)
              assert m,name
              got=hashlib.sha256(m.group(0).encode()).hexdigest()
              assert got==wanted,(name,got,wanted)
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,code in enumerate(scripts): Path(f'/tmp/v799100-inline-{i}.js').write_text(code)
          PY
          node --check assets/js/trip-map-service.js
          node --check sw.js
          for f in /tmp/v799100-inline-*.js; do node --check "$f"; done
      - name: Commit v7.9.10.0
        shell: bash
        run: |
          git config user.name "Travel WebApp Release"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/js/trip-map-service.js manifest.json sw.js CHANGELOG.md
          git commit -m "Release v7.9.10.0 Places interactive location picker"
          git push origin main
