name: v7.9.10.4 final audited release

on:
  push:
    paths:
      - '.github/workflows/v79104-release-final.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preserve accepted baseline and apply verified patch
        run: |
          cp index.html /tmp/v79103-index.html
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, re, subprocess, zlib
          expected = {
            'index.html': '5bf81803796196c756291fad2085ed0dc3f22e7e',
            'manifest.json': '1efa43b944807ef3fde672f41891ccf48bbc92fd',
            'sw.js': '8889056154f5938f56094948d2b06e17c855b31a',
            'CHANGELOG.md': 'db3850207561833e5d27119a3403b72fdd9ec413',
            'assets/js/trip-edit-session-service.js': '2c0728cd83c4e6e0bce97b1b8eccd0e6ec01b3d0',
            'functions/index.js': 'f154eee2b1c8340737c8558ce38a478a10d87d44'
          }
          for path, sha in expected.items():
              got = subprocess.check_output(['git','rev-parse',f'HEAD:{path}'], text=True).strip()
              if got != sha:
                  raise SystemExit(f'Baseline guard failed for {path}: {got} != {sha}')
          staging = Path('.github/workflows/v79104-release.yml').read_text()
          match = re.search(r"encoded = '([^']+)'", staging)
          if not match:
              raise SystemExit('Verified patch payload missing')
          patch = zlib.decompress(base64.b64decode(match.group(1)))
          digest = hashlib.sha256(patch).hexdigest()
          if digest != '15ddb1b4c82c786d8b2dc771c7ab8f9e2f64003d5dd8308afeee6f8d6093aeae':
              raise SystemExit(f'Patch digest mismatch: {digest}')
          Path('/tmp/v79104.patch').write_bytes(patch)
          subprocess.check_call(['git','apply','-p1','--check','/tmp/v79104.patch'])
          subprocess.check_call(['git','apply','-p1','/tmp/v79104.patch'])
          expected_out = {
            'index.html': 'c503cf8f497cfeb7d2c1a04ed1b9c678eeaf8fc082af0572332e72bd3bc885e4',
            'manifest.json': '785be50c3215d1c9b708a996511262181dd7f76f56016870af5a93435146b6fb',
            'sw.js': 'abca69cf57f1e065fdf53025a3070e078d42255f4c335c323772e7887636c91e',
            'CHANGELOG.md': '331420525f93977be45c2e6ad8217e5b3be4a62cc42b0daf4a36c420a675408f'
          }
          for path, wanted in expected_out.items():
              got = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if got != wanted:
                  raise SystemExit(f'Output digest mismatch for {path}: {got} != {wanted}')
          print('Verified patch and exact outputs OK')
          PY

      - name: Static QA and frozen surface guard
        run: |
          node --check sw.js
          node --check functions/index.js
          node --input-type=module --check < assets/js/trip-edit-session-service.js
          python -m json.tool manifest.json >/dev/null
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          s = Path('index.html').read_text()
          base = Path('/tmp/v79103-index.html').read_text()
          assert 'const APP_VERSION = "7.9.10.4";' in s
          assert '7.9.10.3' not in s
          assert json.loads(Path('manifest.json').read_text())['start_url'].endswith('build=7.9.10.4')
          assert 'travel-shell-v7.9.10.4' in Path('sw.js').read_text()

          static_html = re.sub(r'<script(?:\s[^>]*)?>.*?</script>', '', s, flags=re.S|re.I)
          ids = re.findall(r'\bid="([^"]+)"', static_html)
          seen, duplicates = set(), set()
          for value in ids:
              if value in seen:
                  duplicates.add(value)
              seen.add(value)
          if duplicates:
              raise SystemExit(f'Duplicate static DOM ids: {sorted(duplicates)[:20]}')

          def unchanged_slice(start, end):
              a0=base.index(start); a1=base.index(end,a0)
              b0=s.index(start); b1=s.index(end,b0)
              if hashlib.sha256(base[a0:a1].encode()).digest() != hashlib.sha256(s[b0:b1].encode()).digest():
                  raise SystemExit(f'Protected block changed: {start}')
          unchanged_slice('async function renderTripMapScope(scope=tripMapScope){','async function openTripMap(){')
          unchanged_slice('async function ensureTransitRoutePlanner(itemEl){','// Phase 3E · Edit Session foundation')
          unchanged_slice('async function tripEditHandleMapPick(coords={}){','async function deleteTripEditItemFromSession(){')

          for fn in ['refreshCollapseMetrics','updateCompactHeader','updateCollapsingChrome','scheduleCollapseUpdate']:
              pat=re.compile(rf'function {fn}\([^)]*\)\{{.*?\n\}}',re.S)
              a,b=pat.search(base),pat.search(s)
              if not a or not b or hashlib.sha256(a.group(0).encode()).digest()!=hashlib.sha256(b.group(0).encode()).digest():
                  raise SystemExit(f'Protected Day/Chrome function changed: {fn}')

          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,block in enumerate(blocks):
              if block.strip(): Path(f'/tmp/inline_{i}.js').write_text(block)
          print('Static QA and frozen surface guard OK')
          PY
          for f in /tmp/inline_*.js; do node --check "$f"; done

      - name: Offline state coherence regression QA
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          start=s.index('function tripEditPresentationSignature(data){')
          end=s.index('function tripEditHasPermission(){',start)
          block=s[start:end]
          lines=[
            'function dataTripId(data){return String(data?.tripId||data?.meta?.tripId||"");}',
            'function renderSignature(value,fallback=""){try{return JSON.stringify(value)+"|"+fallback}catch(_){return fallback}}',
            'globalThis.window={tripData:null};', block,
            'const item=(id,title)=>({itemId:id,kind:"stop",time:"09:00",title,note:"",sortOrder:id==="a"?0:1,who:"all",icon:"P",detail:"",maps:"",location:{name:title,placeId:"",latitude:1,longitude:2,address:"",mapsUrl:""}});',
            'const trip=(revision,items,confirmed=false)=>({tripId:"t1",revision,cloudMeta:{serverConfirmed:confirmed,hasPendingWrites:false},days:[{dayId:"d1",items}]});',
            'window.tripData=trip(10,[item("a","A")],true);',
            'if(!tripEditIncomingSnapshotRegressesCurrent(trip(9,[item("a","A"),item("b","B")],false),{source:"cache",nextId:"t1",currentId:"t1"}))throw new Error("lower revision not blocked");',
            'if(!tripEditIncomingSnapshotRegressesCurrent(trip(10,[item("a","A"),item("b","B")],false),{source:"cache",nextId:"t1",currentId:"t1"}))throw new Error("same revision divergent cache not blocked");',
            'if(tripEditIncomingSnapshotRegressesCurrent(trip(10,[item("a","A")],false),{source:"cache",nextId:"t1",currentId:"t1"}))throw new Error("matching cache blocked");',
            'if(tripEditIncomingSnapshotRegressesCurrent(trip(10,[item("a","A"),item("b","B")],true),{source:"server",nextId:"t1",currentId:"t1"}))throw new Error("confirmed same revision blocked");',
            'if(tripEditIncomingSnapshotRegressesCurrent(trip(11,[item("a","A"),item("b","B")],true),{source:"server",nextId:"t1",currentId:"t1"}))throw new Error("newer revision blocked");',
            'console.log("Offline state coherence regression QA OK");'
          ]
          Path('/tmp/test-v79104.js').write_text('\n'.join(lines))
          PY
          node /tmp/test-v79104.js

      - name: Build clean backup ZIP
        run: |
          zip -qr /tmp/Travel_WebApp_v7.9.10.4_backup.zip . \
            -x '.git/*' '.github/workflows/v79104-release.yml' '.github/workflows/v79104-release-final.yml'
          unzip -t /tmp/Travel_WebApp_v7.9.10.4_backup.zip >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: Travel_WebApp_v7.9.10.4_backup
          path: /tmp/Travel_WebApp_v7.9.10.4_backup.zip
          retention-days: 7

      - name: Commit verified release and remove temporary runners
        run: |
          git config user.name 'yutintinmarco'
          git config user.email 'marcoyu1121@gmail.com'
          git add index.html manifest.json sw.js CHANGELOG.md
          git rm .github/workflows/v79104-release.yml .github/workflows/v79104-release-final.yml
          git commit -m 'v7.9.10.4 Phase 3E offline edit and map state coherence'
          git push origin main
